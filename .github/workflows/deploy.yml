name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: ['backup/**', 'docs/**', '*.md']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Creates/enables the Pages site (source: GitHub Actions) on first run.
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Before the custom domain is connected the site lives at <user>.github.io/<repo>/,
      # so assets need that base path. With a custom domain the base path is empty and
      # this resolves to "/". VITE_SUPABASE_* and VITE_CLOUDINARY_* come from the committed
      # .env (publishable values only).
      - run: npm run build
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
